<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" fill="none">
<defs>
  <linearGradient id="bg" x1="70" y1="80" x2="830" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#0F1015"/><stop offset="1" stop-color="#211B36"/></linearGradient>
  <linearGradient id="violet" x1="120" y1="120" x2="760" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#CFC4FF"/><stop offset=".45" stop-color="#8064FF"/><stop offset="1" stop-color="#5635E8"/></linearGradient>
  <linearGradient id="soft" x1="180" y1="160" x2="690" y2="550" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
  <linearGradient id="line" x1="80" y1="610" x2="820" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#7155FF" stop-opacity=".15"/><stop offset=".5" stop-color="#A992FF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#FFF" stroke-opacity=".045"/></pattern>
</defs>
<rect width="900" height="720" rx="48" fill="url(#bg)"/>
<rect width="900" height="720" rx="48" fill="url(#grid)"/>
<circle cx="690" cy="150" r="170" fill="#7657FF" opacity=".16" filter="url(#glow)"/>
<circle cx="210" cy="580" r="150" fill="#7657FF" opacity=".12" filter="url(#glow)"/>

<!-- Camino visual: IDEA → IDENTIDAD → VISIBILIDAD → CRECIMIENTO -->
<path d="M82 548 C188 532 245 500 326 446 C414 387 458 340 542 302 C627 264 681 218 816 156" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
<path d="M82 548 C188 532 245 500 326 446 C414 387 458 340 542 302 C627 264 681 218 816 156" stroke="#9A84FF" stroke-opacity=".12" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

<!-- nodos -->
<circle cx="120" cy="538" r="34" fill="#15161D" stroke="#8064FF" stroke-opacity=".75"/>
<circle cx="326" cy="446" r="34" fill="#15161D" stroke="#8064FF" stroke-opacity=".75"/>
<circle cx="542" cy="302" r="34" fill="#15161D" stroke="#A992FF" stroke-opacity=".85"/>
<circle cx="816" cy="156" r="42" fill="url(#violet)" filter="url(#shadow)"/>

<!-- iconos minimalistas -->
<path d="M109 540C109 530 117 522 127 522C136 522 143 529 143 538C143 548 136 555 126 555C117 555 109 549 109 540Z" stroke="#FFF" stroke-width="2"/>
<path d="M315 454L326 435L337 454L326 462Z" fill="#FFF" fill-opacity=".9"/>
<path d="M529 309L542 293L555 309L542 315Z" fill="#FFF" fill-opacity=".9"/>
<path d="M800 170V142M800 170H828M807 162L817 152" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- etiquetas -->
<rect x="76" y="604" width="116" height="54" rx="16" fill="#FFF" fill-opacity=".96" filter="url(#shadow)"/>
<text x="96" y="626" fill="#737783" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4">01 · IDEA</text>
<text x="96" y="646" fill="#11131A" font-family="Arial,sans-serif" font-size="15" font-weight="700">La aterrizamos</text>

<rect x="265" y="487" width="142" height="54" rx="16" fill="#FFF" fill-opacity=".96" filter="url(#shadow)"/>
<text x="285" y="509" fill="#737783" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4">02 · IDENTIDAD</text>
<text x="285" y="529" fill="#11131A" font-family="Arial,sans-serif" font-size="15" font-weight="700">La construimos</text>

<rect x="472" y="226" width="154" height="54" rx="16" fill="#FFF" fill-opacity=".96" filter="url(#shadow)"/>
<text x="492" y="248" fill="#737783" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4">03 · VISIBILIDAD</text>
<text x="492" y="268" fill="#11131A" font-family="Arial,sans-serif" font-size="15" font-weight="700">La hacemos crecer</text>

<rect x="650" y="78" width="176" height="58" rx="17" fill="#FFF" fill-opacity=".97" filter="url(#shadow)"/>
<text x="672" y="101" fill="#737783" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.4">04 · CRECIMIENTO</text>
<text x="672" y="123" fill="#6D4AFF" font-family="Arial,sans-serif" font-size="16" font-weight="700">La convertimos en acción</text>

<!-- centro de marca -->
<g filter="url(#shadow)">
<circle cx="455" cy="348" r="116" fill="url(#soft)" stroke="#FFF" stroke-opacity=".13"/>
<circle cx="455" cy="348" r="72" fill="#101116" stroke="#A992FF" stroke-opacity=".45"/>
<text x="455" y="340" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SOLO</text>
<text x="455" y="364" text-anchor="middle" fill="#FFF" font-family="Arial,sans-serif" font-size="24" font-weight="700">ESTUDIO</text>
<circle cx="455" cy="388" r="4" fill="#8A70FF"/>
</g>

<text x="72" y="82" fill="#FFF" font-family="Arial,sans-serif" font-size="11" letter-spacing="2.5" opacity=".7">UNA IDEA MERECE SER VISTA</text>
<circle cx="798" cy="84" r="6" fill="#FFF"/><circle cx="820" cy="84" r="6" fill="#A992FF"/><circle cx="842" cy="84" r="6" fill="#6D4AFF"/>
</svg>